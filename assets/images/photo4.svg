<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#FFF3E0" rx="10"/>
  <!-- Spiky Hair -->
  <path d="M 80 40 L 75 25 M 90 40 L 90 20 M 100 40 L 105 20 M 110 40 L 115 25 M 120 40 L 125 25" stroke="#000" stroke-width="2"/>
  <!-- Body -->
  <rect x="65" y="40" width="70" height="120" rx="35" fill="#FFD500"/>
  <!-- Goggle Strap -->
  <rect x="63" y="70" width="74" height="10" fill="#1B1F3B"/>
  <!-- Goggles (Two Eyes, crossed or looking silly) -->
  <circle cx="86" cy="74" r="16" fill="#B0B0B0" stroke="#707070" stroke-width="1.5"/>
  <circle cx="114" cy="74" r="16" fill="#B0B0B0" stroke="#707070" stroke-width="1.5"/>
  <circle cx="86" cy="74" r="11" fill="#FFFFFF"/>
  <circle cx="114" cy="74" r="11" fill="#FFFFFF"/>
  <!-- Crossed eyes -->
  <circle cx="91" cy="74" r="4" fill="#7A5230"/>
  <circle cx="109" cy="74" r="4" fill="#7A5230"/>
  <circle cx="91" cy="74" r="2" fill="#000000"/>
  <circle cx="109" cy="74" r="2" fill="#000000"/>
  <!-- Tongue sticking out -->
  <path d="M 90 105 Q 100 115 110 105" stroke="#000" stroke-width="2" fill="none"/>
  <path d="M 95 109 C 95 118 105 118 105 109 Z" fill="#E91E63" stroke="#000" stroke-width="1.5"/>
  <!-- Overalls -->
  <path d="M 65 120 L 135 120 L 135 150 C 135 160 65 160 65 150 Z" fill="#2C3E91"/>
  <rect x="80" y="112" width="40" height="20" fill="#2C3E91"/>
</svg>
