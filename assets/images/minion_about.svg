<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#FFEFA6" rx="10"/>
  <!-- Hair -->
  <path d="M 90 40 Q 95 20 90 10 M 100 40 Q 100 15 102 10 M 110 40 Q 105 20 110 10" stroke="#000" stroke-width="2" fill="none"/>
  <!-- Body -->
  <rect x="60" y="40" width="80" height="120" rx="40" fill="#FFD500"/>
  <!-- Goggle Strap -->
  <rect x="58" y="70" width="84" height="12" fill="#1B1F3B"/>
  <!-- Goggle Frame -->
  <circle cx="85" cy="76" r="18" fill="#B0B0B0" stroke="#707070" stroke-width="2"/>
  <circle cx="115" cy="76" r="18" fill="#B0B0B0" stroke="#707070" stroke-width="2"/>
  <!-- Goggle Lens/Eye White -->
  <circle cx="85" cy="76" r="13" fill="#FFFFFF"/>
  <circle cx="115" cy="76" r="13" fill="#FFFFFF"/>
  <!-- Irises -->
  <circle cx="87" cy="76" r="6" fill="#7A5230"/>
  <circle cx="113" cy="76" r="6" fill="#7A5230"/>
  <!-- Pupils -->
  <circle cx="87" cy="76" r="3" fill="#000000"/>
  <circle cx="113" cy="76" r="3" fill="#000000"/>
  <!-- Mouth -->
  <path d="M 85 110 Q 100 125 115 110" stroke="#000000" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Overalls -->
  <path d="M 60 120 L 140 120 L 140 150 C 140 160 60 160 60 150 Z" fill="#2C3E91"/>
  <rect x="75" y="110" width="50" height="20" fill="#2C3E91"/>
  <!-- Overalls straps -->
  <path d="M 60 110 L 75 115 L 75 125 L 60 118 Z" fill="#223173"/>
  <path d="M 140 110 L 125 115 L 125 125 L 140 118 Z" fill="#223173"/>
  <!-- Strap buttons -->
  <circle cx="71" cy="118" r="2.5" fill="#1B1F3B"/>
  <circle cx="129" cy="118" r="2.5" fill="#1B1F3B"/>
  <!-- Pocket -->
  <path d="M 90 125 L 110 125 L 110 140 L 100 145 L 90 140 Z" fill="#223173"/>
  <!-- Hands/Arms -->
  <path d="M 60 115 Q 40 110 35 95" stroke="#FFD500" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M 140 115 Q 160 110 165 95" stroke="#FFD500" stroke-width="8" stroke-linecap="round" fill="none"/>
  <!-- Gloves -->
  <circle cx="35" cy="95" r="6" fill="#1B1F3B"/>
  <circle cx="165" cy="95" r="6" fill="#1B1F3B"/>
</svg>
